name: DeveloperAssistant

options:
  bundleIdPrefix: com.infinity
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: 开发管理助手
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
    INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

targets:
  DeveloperAssistant:
    type: application
    platform: macOS
    sources:
      - path: DeveloperAssistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.infinity.developer-assistant
        PRODUCT_NAME: DeveloperAssistant
    scheme:
      testTargets:
        - DeveloperAssistantTests

  DeveloperAssistantTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DeveloperAssistantTests
    dependencies:
      - target: DeveloperAssistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.infinity.developer-assistant.tests
        GENERATE_INFOPLIST_FILE: YES
