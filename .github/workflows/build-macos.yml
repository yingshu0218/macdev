name: Build macOS Tauri App

on:
  workflow_dispatch:
  pull_request:
    paths: ["src/**", "src-tauri/**", "package.json", "package-lock.json", "vite.config.ts", "tsconfig.json", ".github/workflows/build-macos.yml"]

permissions:
  contents: read

jobs:
  build:
    name: Build unsigned macOS bundle
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm ci
      - name: Build Tauri app and DMG
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: dev-admin-assistant-macos-unsigned
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
